<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ระบบจองที่พัก SMA</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  :root{--ink:#2b1b12;--muted:#8c7256;--line:#f0dfba;--paper:#fff8ea;--surface:#fff;
    --brand:#e0272a;--brand2:#b01f22;--brand-soft:#fbe6e3;
    --gold:#ffc72c;--gold-soft:#fff3d1;
    --success:#1f9d57;--success-soft:#e3f5e9;
    --amber:#c98a00;--amber-soft:#fbf1d6;
    --danger:#a61b3d;--danger-soft:#f7dee1;
    --male:#1b5aa8;--male-soft:#e2edf8;--female:#b23a72;--female-soft:#f8e3ee;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  *:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  body{margin:0;background:#f6e2ab;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:18px 10px 40px}
  .rolebar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);font-size:12.5px;font-weight:600;color:var(--muted)}
  .rolebar b{color:var(--ink)}
  .rolebar .badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
  .rolebar a{color:var(--brand);font-weight:700;cursor:pointer;text-decoration:none;margin-left:4px}
  .phone{width:390px;max-width:100%;height:800px;background:var(--paper);border-radius:38px;box-shadow:0 20px 50px rgba(0,0,0,.28);overflow:hidden;position:relative;border:10px solid #2a1810}
  .statusbar{height:34px;background:var(--brand);display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#fff;font-size:12px;font-weight:600}
  /* On a real phone the decorative phone-frame illustration doesn't fit inside
     the real viewport (measured: 800px frame vs ~714px of usable height after
     the rolebar, on a 375x812 device) and forces double scrolling. Drop the
     bezel/shadow/fake-statusbar chrome below ~430px so content uses the real
     screen instead of a picture of one; keep the rolebar, it's real navigation. */
  @media (max-width:430px){
    body{padding:0;height:100vh;height:100dvh}
    .phone{width:100%;max-width:none;height:auto;flex:1;min-height:0;border:0;border-radius:0;box-shadow:none}
    .statusbar{display:none}
  }
  .appbar{background:var(--brand);color:#fff;padding:6px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
  .appbar .back{font-size:20px;cursor:pointer;width:24px;opacity:.9}
  .appbar h1{font-size:16px;margin:0;font-weight:700;flex:1}
  .appbar .sub{font-size:11px;opacity:.8;font-weight:500}
  /* Admin's function hub — was 11 nav links squeezed into a single flex-nowrap
     row inside .appbar (measured down to 16-22px wide, text wrapping 5 lines
     tall). Moved out of the branded header into its own wrapping, grouped
     surface with real tap targets instead. */
  .adminnav{margin-bottom:14px}
  .adminnav .grp{margin-bottom:10px}
  .adminnav .grp:last-child{margin-bottom:0}
  .adminnav .grp-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px}
  .adminnav .chips{display:flex;flex-wrap:wrap;gap:8px}
  .adminnav .chip{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
  .adminnav .chip:hover{border-color:var(--brand)}
  .adminnav .chip.urgent{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);font-weight:700}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column}
  .body{flex:1;overflow-y:auto;padding:16px}
  /* Admin/AREA detail's decision buttons used to sit at the bottom of a
     2,900px-tall document with no way to reach them without scrolling past
     the whole guest list, map and hotel list first. Pin them instead. */
  .stickyactions{position:sticky;bottom:-16px;margin:12px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.06)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 4px}
  .label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .val{font-size:15px;font-weight:600}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .pill.soon{background:var(--danger-soft);color:var(--danger)}
  .pill.ok{background:var(--success-soft);color:var(--success)}
  .pill.wait{background:var(--amber-soft);color:var(--amber)}
  .pill.area{background:#efe7f6;color:#6b3fa0}
  .btn{display:block;width:100%;border:0;font-family:inherit;font-weight:700;font-size:15px;padding:14px;border-radius:14px;background:var(--brand);color:#fff;cursor:pointer;margin-top:4px}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
  .btn.danger{background:var(--danger)}
  .btn:disabled{background:#c7c7c7;cursor:not-allowed}
  .job{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer}
  .job.static{cursor:default}
  .job:active{background:#fff3da}
  .job .d{background:var(--brand-soft);color:var(--brand);border-radius:11px;width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.05}
  .job .d small{font-size:9px;font-weight:600}
  .job .g{flex:1}.job .g .t{font-weight:700;font-size:14px}.job .g .s{font-size:11px;color:var(--muted);margin-top:2px}
  .chev{color:#c3c3c3;font-size:18px}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;width:fit-content;overflow:hidden}
  .stepper button{border:0;background:#fff;width:44px;height:44px;font-size:22px;color:var(--brand);cursor:pointer}
  .stepper span{min-width:46px;text-align:center;font-weight:700;font-size:17px}
  .hotel{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:13px;padding:11px;margin-bottom:9px;cursor:pointer}
  .hotel.sel{border-color:var(--brand);background:var(--brand-soft)}
  .hotel .chk{width:21px;height:21px;border-radius:6px;border:2px solid #cfd8d3;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700}
  .hotel.sel .chk{background:var(--brand);border-color:var(--brand)}
  .hotel .n{flex:1}.hotel .n .t{font-weight:600;font-size:13.5px}.hotel .n .s{font-size:11px;color:var(--muted)}
  .hotel .n .s a{color:var(--brand);font-weight:600}
  .hotel .p{font-weight:700;font-size:14px}
  /* The only door to 82% of a province's hotel inventory used to be an 11px
     muted-grey line with list-style:none (no marker at all) — no visual sign
     it opened anything. Real button look + an explicit chevron instead. */
  .disclosure{display:flex;align-items:center;gap:8px;cursor:pointer;padding:11px 14px;margin:4px 0 9px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;font-size:13px;font-weight:700;color:var(--brand)}
  .disclosure::before{content:'▸';font-size:11px;transition:transform .15s}
  details[open]>.disclosure::before{transform:rotate(90deg)}
  .hotel.radio .chk{border-radius:50%}
  .rmv{font-size:11px;color:var(--danger);font-weight:700;cursor:pointer}
  .gt{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
  .gt.m{background:var(--male-soft);color:var(--male)}.gt.f{background:var(--female-soft);color:var(--female)}
  input.txt,select.txt{width:100%;font-family:inherit;font-size:14px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  textarea.txt{width:100%;font-family:inherit;font-size:14px;padding:12px;border:1.5px solid var(--line);border-radius:12px;resize:none;height:60px}
  .warn{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;padding:11px;border-radius:12px;margin-bottom:9px;font-weight:600}
  .warn.a{background:var(--amber-soft);color:#8a6200}.warn.d{background:var(--danger-soft);color:var(--danger)}.warn.g{background:var(--success-soft);color:var(--success)}
  .roomgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .room{border-radius:13px;padding:11px;border:1.5px solid}
  .room.m{background:var(--male-soft);border-color:#bcd7e6}.room.f{background:var(--female-soft);border-color:#e8c4da}
  .room .rh{font-size:11px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
  .room.m .rh{color:var(--male)}.room.f .rh{color:var(--female)}
  .room .oc{font-size:12.5px;font-weight:600;line-height:1.5}
  .room .empty{font-size:11px;font-weight:600;opacity:.7;font-style:italic}
  .slot{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .slot .sh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;font-weight:700}
  .slot .res{font-size:12px;color:var(--brand);font-weight:600;margin-top:6px}
  .slot .res.no{color:var(--amber)}
  .guestcard{background:#faf9f6;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .timeline{list-style:none;padding:0;margin:0}
  .timeline li{display:flex;gap:12px;padding-bottom:16px;position:relative}
  .timeline li:before{content:"";position:absolute;left:8px;top:20px;bottom:-4px;width:2px;background:var(--line)}
  .timeline li:last-child:before{display:none}
  .dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);background:#fff;flex-shrink:0;margin-top:1px}
  .timeline li.done .dot{background:var(--brand);border-color:var(--brand)}.timeline li.now .dot{border-color:var(--brand)}
  .timeline .tt{font-weight:700;font-size:13.5px}.timeline .ts{font-size:11px;color:var(--muted)}.timeline li.dim{opacity:.45}
  .copyrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .copyrow:last-child{border-bottom:0}.copyrow .k{font-size:11px;color:var(--muted);font-weight:600;min-width:50px}
  .copyrow .v{font-size:12.5px;font-weight:600;text-align:right;flex:1;margin:0 8px;line-height:1.4;word-break:break-word}
  .copyrow .cp{font-size:11px;color:var(--brand);font-weight:700;border:1px solid var(--brand);border-radius:8px;padding:6px 10px;min-height:32px;display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap}
  .hint{font-size:11px;color:var(--muted);margin:2px 0 12px}
  .addnew{border:1.5px dashed var(--line);border-radius:12px;padding:11px;text-align:center;color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;margin-top:6px}
  /* Distinct from .addnew ("+ add new X") on purpose — copying the whole
     guest list is the admin's single most-used action on this screen, was
     styled identically to "create new" and buried below 22 individual
     per-field copy buttons. Solid brand fill + placed above them instead. */
  .copyall{background:var(--brand);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .chip{border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:13px;font-weight:600;cursor:pointer;flex:1;text-align:center;min-width:44%}
  .chip:active{background:#fff3da}
  .chip.sel{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
  .toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#2a1810;color:#fff;font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;max-width:80%;text-align:center;z-index:50}
  .toast.show{opacity:1}
  .errtext{font-size:12.5px;color:var(--danger);font-weight:700;margin-top:8px}
  .navlink{display:block;text-align:center;font-size:12.5px;font-weight:700;color:var(--brand);padding:10px;cursor:pointer;text-decoration:none}
  .maplink{color:var(--brand);text-decoration:none;font-weight:600;white-space:nowrap}
  /* Desktop/tablet: the same fixed 390x800 phone-frame illustration (plus a
     fake, never-changing "▲ 100%" battery) was rendering at 1280px wide too —
     measured at 69% of the viewport left as decorative beige, with the app's
     own single-viewport app-shell scroll (.screen{position:absolute}, sized
     for a phone) creating a second, unnecessary inner scrollbar on top of the
     normal page scroll. Above this width there's no viewport to simulate, so
     drop the frame and let the page scroll like a normal desktop site.
     Placed last on purpose — .screen/.body/.phone are (re)defined earlier in
     this sheet with equal specificity, and a same-specificity override only
     wins by coming later in source order, media query or not. */
  @media (min-width:700px){
    body{height:auto;padding:24px 16px 48px}
    .phone{width:100%;max-width:820px;height:auto;border:0;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
    .statusbar{display:none}
    .screen{position:static}
  }
</style>
</head>
<body>
<div class="rolebar" id="rolebar">ระบบจองที่พัก SMA · เข้าสู่ระบบด้วยรหัสพนักงาน</div>
<div class="phone">
  <div class="statusbar"><span id="clock">9:41</span><span>SMA จองที่พัก</span><span>▲ 100%</span></div>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
/* =========================================================================
   ระบบจองที่พักภาคสนาม SMA — เชื่อมฐานข้อมูลจริง (Supabase ผ่าน /api)
   ข้อมูลทั้งหมดมาจาก API ไม่มีข้อมูลฝังในหน้านี้
   ========================================================================= */

const API = '/api';
const SPECIAL_POS = ["ผู้บริหาร","แอดมิน","Sales & Marketing Division Manager","หัวหน้าแผนกกิจกรรมร้านค้า"];
// Mirrors lib/auth.js's AREA_APPROVER_POSITION — a person's job position,
// distinct from teams.code==='AREA' (an actual team, unrelated concept).
const AREA_APPROVER_POSITION = "ผู้ตรวจอนุมัติพื้นที่";
const THMONTH = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

/* ---------------- reference data (filled by /api/bootstrap) ---------------- */
let ME = null, IS_ADMIN = false, IS_AREA_APPROVER = false;
let BRANCHES = [], HOTELS = [], TEAMS = [], STAFF_LIST = [], SCHEDULE = [];
let STAFF = {}, BRANCH_BY_CODE = {}, PROVINCES = [];
let BOOKINGS = [];
let MISSION_TYPES = ["งานแฟร์","งานเปิดสาขา","สำรวจพื้นที่","อื่นๆ"];
let S = {}, CH = {}, VOUCH = {}, REJ = {}, ADDG = {}, JOINQ = {}, DEP = {};
let SPARE_LIST = [], DEPCLAIMS = [];

const $ = s => document.querySelector(s);
let TOAST_TIMER=null;
// role=status/aria-live is on the element itself (set once in the static markup)
// so screen readers announce every message, not just visual ones. Longer
// messages are usually server error text, not "Saved ✓" — worth more time on
// screen before it vanishes. clearTimeout guards a fast second toast from
// getting cut short by the first one's already-scheduled hide.
function toast(t){ const e=$("#toast"); if(!e) return; e.textContent=t; e.classList.add("show"); if(TOAST_TIMER) clearTimeout(TOAST_TIMER); TOAST_TIMER=setTimeout(()=>e.classList.remove("show"), String(t).length>30?5000:2200); }
function rerender(fn){ const b=document.querySelector('.body'); const y=b?b.scrollTop:0; fn(); const nb=document.querySelector('.body'); if(nb)nb.scrollTop=y; if(fn===renderForm) saveFormDraft(); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nickOf(p){ return String(p&&(p.nickname||p.nick)||'').replace(/\s*[ชญ]\s*$/,'').trim() || (p&&p.name) || ''; }
function isSpecialRole(pos){ return SPECIAL_POS.includes(pos); }
function navChip(label, fn, extraClass){ return `<span class="chip${extraClass?' '+extraClass:''}" role="button" tabindex="0" onclick="${fn}" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();${fn}}">${label}</span>`; }
function copyChip(argExpr){ const fn=`copyTxt(${argExpr})`; return `<span class="cp" role="button" tabindex="0" onclick="${fn}" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();${fn}}">คัดลอก</span>`; }
function fmtDate(s){ if(!s) return "—"; const d=new Date(s); return d.getDate()+" "+THMONTH[d.getMonth()]+" "+String(d.getFullYear()+543).slice(-2); }
function daysBetween(a,b){ if(!a||!b) return 0; return Math.max(0, Math.round((new Date(b)-new Date(a))/86400000)); }
// Both date <input>s shipped with no min/max — nothing stopped a check-in in
// 2019 or 2031, and combined with the fmtDate BE-year bug the user had no way
// to sanity-check what they'd picked. min=today (bookings are always forward),
// max=+1 year (generous ceiling, not a real business rule to enforce tightly).
function dateISO(d){ return d.toISOString().slice(0,10); }
function dateInputMin(){ return dateISO(new Date()); }
function dateInputMax(){ const d=new Date(); d.setFullYear(d.getFullYear()+1); return dateISO(d); }
function haversine(lat1,lng1,lat2,lng2){
  if(lat1==null||lng1==null||lat2==null||lng2==null) return null;
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
// Straight-line (haversine) distance always underestimates the real drive since
// roads curve — a provincial road can easily be 20-40% longer than as-the-crow-
// flies, confirmed against a real route (Google Maps: 1.9km straight-line vs
// 2.3km/actual road for a ปราจีนบุรี branch<->hotel pair). Applying a circuity
// factor here gets every "ห่าง X กม." label and sort closer to a real drive
// without calling the routing API per-hotel (a province can have 100+ hotels —
// real routing is reserved for the few places that already call drivingDistance()
// directly: the home-distance-rule and the dashboard's measure tool).
const ROAD_CIRCUITY_FACTOR = 1.3;
function roadKm(straightKm){ return straightKm==null ? null : straightKm*ROAD_CIRCUITY_FACTOR; }
// Most branches in the registry were bulk-imported with lat/lng defaulted to
// 0,0 (Null Island) rather than left blank — treat that the same as "no
// coordinates yet" everywhere, or the distance features below compute a
// meaningless ~11,000km trip to the Gulf of Guinea instead of skipping.
function hasBranchCoords(j){ return j.blat!=null && j.blng!=null && j.blat!==0 && j.blng!==0; }
// สรุป-requirement-แผนที่จองที่พัก.md §3 — fires right after a branch (with
// coordinates) is picked, before the employee even sees the hotel list. Keyed
// on branch+coords so it only re-fetches when the branch actually changes, not
// on every rerender(renderForm) call the rest of the form triggers.
const HOME_DISTANCE_WARN_KM = 10;
async function checkHomeDistanceIfNeeded(){
  const j = S.job;
  if (!ME || ME.home_lat == null || ME.home_lng == null || !hasBranchCoords(j)) {
    S.homeCheck = null; S._homeCheckKey = null;
    return;
  }
  const key = j.branchCode + '|' + j.blat + ',' + j.blng;
  if (S._homeCheckKey === key) return;
  S._homeCheckKey = key;
  S.homeCheck = { loading: true, km: null, min: null, reason: (S.homeCheck && S.homeCheck.reason) || '' };
  try {
    const r = await apiGet(`/directions?actor=${encodeURIComponent(ME.code)}&from_lat=${ME.home_lat}&from_lng=${ME.home_lng}&to_lat=${j.blat}&to_lng=${j.blng}`);
    if (S._homeCheckKey === key) {
      S.homeCheck = Object.assign({}, S.homeCheck, { loading: false, km: r.distance_km, min: r.duration_min });
      rerender(renderForm);
    }
  } catch (e) {
    if (S._homeCheckKey === key) {
      S.homeCheck = Object.assign({}, S.homeCheck, { loading: false, km: null, min: null });
      rerender(renderForm);
    }
  }
}
function setHomeCheckReason(v){ if(S.homeCheck) S.homeCheck.reason = v; }

function setHomeLinkDraft(v){ S.homeLinkDraft = v; } // silent — typing must never re-render
function parseLatLng(text){
  text = String(text||'').trim();
  let m = text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) // shared-link @lat,lng
    || text.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/) // ?q=lat,lng
    || text.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/); // typed straight as lat,lng
  if(!m) return null;
  const lat=Number(m[1]), lng=Number(m[2]);
  return (Number.isFinite(lat)&&Number.isFinite(lng)) ? {lat,lng} : null;
}

/* ---------------- normalise API shapes into what the UI expects ---------------- */
// mapLink is derived from lat/lng, not read from the stored map_link column —
// map_link turned out to be nothing but a frozen "?q=lat,lng" snapshot taken
// once at Choowap-import time (662/667 rows, verified via /api/bootstrap:
// only 5 differ from that pattern). Correcting a hotel's lat/lng later
// (hotel_update_coords) never touched map_link, so the "ดูใน Maps" button
// kept pointing at the old wrong pin even after the coordinate was fixed.
// Deriving it live from lat/lng means any future coordinate fix is reflected
// immediately with no separate field to keep in sync. Custom (employee-
// added) hotels have no registry lat/lng, so they keep using their own
// pasted custom_map_link (handled separately, not through normHotel).
// Embedding the name in the q= parameter (Google's "q=lat,lng(label)" form)
// makes the pin show that hotel's own name when clicked, instead of an
// unlabeled dot — a plain "?q=lat,lng" link looked identical for every
// hotel and gave no way to visually confirm it was the right place.
function pinLink(lat, lng, name){
  return `https://www.google.com/maps?q=${lat},${lng}(${encodeURIComponent(name||'')})`;
}
function normHotel(h){
  const lat = h.lat==null?null:Number(h.lat), lng = h.lng==null?null:Number(h.lng);
  return { id:h.id, code:h.code, name:h.name, prov:h.province, near:h.near_area,
           lat, lng,
           price:h.default_price_per_night==null?null:Number(h.default_price_per_night),
           choowap:!!h.on_choowap, mapLink: (lat!=null && lng!=null) ? pinLink(lat, lng, h.name) : (h.map_link||null) };
}
// Shared everywhere a hotel/map link needs a tap-out button — stops the click
// from bubbling into whatever selects/toggles the row it sits on.
function mapLinkBtn(url){
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="maplink">📍 ดูใน Maps</a>` : '';
}
// Home<->branch distance shown right after a guest's name in AREA/admin review
// screens (สรุป-requirement's original AREA-approval spec asked for this, never
// built out — the numeric distance always needed *some* known home coordinate,
// so a guest with none gets an inline way to add it instead of just a blank).
function guestHomeDistanceTag(g,b){
  if(!g.code) return '';
  if(g.homeLat==null || g.homeLng==null){
    return `<span class="hint" style="font-size:11px">(ไม่มีข้อมูลที่อยู่ <a onclick="event.stopPropagation();promptAddGuestHome('${esc(g.code)}','${esc(b.id)}',${IS_AREA_APPROVER})" style="color:var(--brand);cursor:pointer;font-weight:700;text-decoration:none">+ เพิ่ม</a>)</span>`;
  }
  if(!hasBranchCoords(b)) return '';
  const km = roadKm(haversine(b.blat,b.blng,g.homeLat,g.homeLng));
  return km!=null ? `<span class="hint" style="font-size:11px">(บ้าน–สาขา ~${km.toFixed(1)} กม.)</span>` : '';
}

// Custom (off-registry) hotels have no lat/lng column — the distance is
// derived from whatever coordinates its own Google Maps link encodes, same
// parser branch-import already uses, so no schema change is needed for this.
function hotelDistanceKm(h,b){
  if(h.lat!=null && h.lng!=null && hasBranchCoords(b)) return roadKm(haversine(b.blat,b.blng,h.lat,h.lng));
  if(h.custom && h.map){
    const p=parseLatLngFromMapsUrl(h.map);
    if(p.lat!=null && hasBranchCoords(b)) return roadKm(haversine(b.blat,b.blng,p.lat,p.lng));
  }
  return null;
}

function normBooking(b){
  const guests = (b.booking_guests||[]).map(g=>({
    id:g.id, g: g.gender==='F' ? 'f' : 'm', team:g.team_code, code:g.employee_code||'',

    homeLat: g.employees && g.employees.home_lat!=null ? Number(g.employees.home_lat) : null,
    homeLng: g.employees && g.employees.home_lng!=null ? Number(g.employees.home_lng) : null
  }));
  const choices = (b.booking_hotel_choices||[]).slice().sort((x,y)=>(x.rank||0)-(y.rank||0)).map(c=>({
    id:c.id,
    code: c.hotels ? c.hotels.code : null,
    name: c.hotels ? c.hotels.name : c.custom_name,
    price: c.custom_price!=null ? Number(c.custom_price) : (c.hotels && c.hotels.default_price_per_night!=null ? Number(c.hotels.default_price_per_night) : null),
    near: c.hotels ? c.hotels.near_area : null,
    // Same reason as normHotel()'s mapLink — a registry hotel's stored
    // map_link is a frozen snapshot from import time, not kept in sync when
    // its lat/lng gets corrected later. Derive live from lat/lng instead;
    // custom (no-registry) hotels keep using their own pasted link.
    map: c.hotels && c.hotels.lat!=null && c.hotels.lng!=null ? pinLink(Number(c.hotels.lat), Number(c.hotels.lng), c.hotels.name) : (c.custom_map_link || ''),
    custom: !c.hotel_id,

  }));
  const pending = (b.booking_changes||[]).filter(c=>c.status==='pending');

    id:j.id, name:j.guest_name, gender:j.guest_gender, phone:j.guest_phone,
    code:j.guest_employee_code, team:j.guest_team_code, requestedBy:j.requested_by_employee
  }));
  return {
    id:b.id, guestList:guests, team:b.team_code, branchCode:b.branch_code,
    branch: b.branches ? b.branches.name : b.branch_code,
    prov: b.branches ? b.branches.province : null,
    blat: b.branches && b.branches.lat!=null ? Number(b.branches.lat) : null,
    blng: b.branches && b.branches.lng!=null ? Number(b.branches.lng) : null,
    jobId:b.work_schedule_id, checkin:b.checkin_date, checkout:b.checkout_date,
    status:b.status, rejectReason:b.reject_reason, note:b.note||'',
    missionType:b.mission_type||null, missionNote:b.mission_type_note||null,
    autoApproved:!!b.auto_approved, ruleViolations:b.rule_violations||[],
    areaApprovedBy:b.area_approved_by||null, areaApprovedAt:b.area_approved_at||null,
    submittedByCode:b.created_by_employee, adhoc: !b.work_schedule_id,
    src: b.team_code==='AREA' ? 'AREA' : 'SMA',
    hotels: choices,
    chosenChoiceId: b.chosen_hotel_choice_id,
    voucher: b.status==='จองสำเร็จ' || b.confirmation_no ? { code:b.confirmation_no, url:b.voucher_file_url, storagePath:b.voucher_storage_path } : null,
    change: ch ? { id:ch.id, type:ch.type, rooms:ch.new_rooms, newCheckin:ch.new_checkin, newCheckout:ch.new_checkout, note:ch.note } : null,
    joinRequests,
    statusLog: (b.booking_status_log||[]).slice().sort((x,y)=>new Date(x.changed_at)-new Date(y.changed_at)),
    derived: b.derived || {}
  };
}
function jobsForMyTeam(){
  return SCHEDULE.filter(s=>s.team_code===ME.team_code).map(s=>{

             prov:br.province||null,

function pair(guests){
  const f=guests.filter(x=>x.g==='f'), m=guests.filter(x=>x.g==='m'), r=[];
  for(let i=0;i<f.length;i+=2) r.push({g:'f',p:f.slice(i,i+2)});
  for(let i=0;i<m.length;i+=2) r.push({g:'m',p:m.slice(i,i+2)});
  return r;
}
function pillOf(b){

// Shared with dashboard.html so logging in on one keeps you logged in on the
// other. localStorage (not sessionStorage) so it survives the tab being
// killed/reopened — the exact scenario a field employee hits on a flaky
// connection or when LINE's in-app browser reclaims memory mid-form.
const ACTOR_STORAGE_KEY = 'sma_actor_code';
function saveActorCode(code){ try{ localStorage.setItem(ACTOR_STORAGE_KEY, code); }catch(e){} }
function clearActorCode(){ try{ localStorage.removeItem(ACTOR_STORAGE_KEY); }catch(e){} }

async function applyBootstrap(d){
  ME = d.me;
  IS_ADMIN = ME.position==='แอดมิน';
  IS_AREA_APPROVER = ME.position===AREA_APPROVER_POSITION;
  BRANCHES = d.branches||[];
  HOTELS = (d.hotels||[]).map(normHotel);
  TEAMS = (d.teams||[]).map(t=>t.code);
  STAFF_LIST = d.staff||[];
  SCHEDULE = d.schedule||[];
  STAFF={}; STAFF_LIST.forEach(s=>{ STAFF[s.code]=s; });
  BRANCH_BY_CODE={}; BRANCHES.forEach(b=>{ BRANCH_BY_CODE[b.code]=b; });
  PROVINCES=[...new Set(HOTELS.filter(h=>h.prov).map(h=>h.prov))].sort();
  if(d.constants && d.constants.mission_types) MISSION_TYPES = d.constants.mission_types;
  saveActorCode(ME.code);
  updateRolebar();
  await reloadBookings(false);
  goHome();
}

// Tries, in order: LINE LIFF auto-login (already-linked LINE account) → a
// previously saved employee code from this browser → the manual login form.
// Opened inside LINE via the /home LIFF link — if this LINE account was already
// linked to an employee (by chatting "ผูกบัญชี" with มะม่วง), skip manual code
// entry entirely. Falls straight through to the normal login form otherwise,
// including when opened in a plain browser (no liff global, or not in a LIFF client).
async function tryStoredLogin(){
  let code; try{ code = localStorage.getItem(ACTOR_STORAGE_KEY); }catch(e){ return false; }
  if(!code) return false;
  try{
    const d = await apiGet('/bootstrap?code='+encodeURIComponent(code));
    await applyBootstrap(d);
    return true;
  }catch(e){
    clearActorCode();
    return false;
  }
}
async function tryLiffAutoLogin(){
  if (typeof liff === 'undefined') { if(!(await tryStoredLogin())) renderLogin(); return; }
  try{
    const cfgRes = await fetch('/api/liff-config');
    const cfg = await cfgRes.json();
    if (!cfgRes.ok) throw new Error(cfg.error);
    await liff.init({ liffId: cfg.liffId });
    if (!liff.isInClient()) { if(!(await tryStoredLogin())) renderLogin(); return; }
    const profile = await liff.getProfile();
    const d = await apiGet('/bootstrap?line_user_id='+encodeURIComponent(profile.userId));
    await applyBootstrap(d);
  }catch(e){
    if(!(await tryStoredLogin())) renderLogin();
  }
}

/* ================= ฟอร์มขอที่พัก ================= */
// Draft key is per-job (or a single fixed slot for ad-hoc) so reopening the
// same unbooked job recovers a half-filled form after a killed tab/app —
// the most damaging gap found in the UX review for field staff on flaky
// connections. Silently restored, no prompt: worst case the employee edits
// what they see, same as any other pre-filled form.
function draftKey(scheduleId){ return 'sma_draft_'+(scheduleId||'adhoc'); }
function loadFormDraft(scheduleId){
  let raw; try{ raw = localStorage.getItem(draftKey(scheduleId)); }catch(e){ return null; }
  if(!raw) return null;
  try{
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.S || (Date.now()-parsed.savedAt) > 24*3600*1000) return null;
    return parsed.S;
  }catch(e){ return null; }
}
function saveFormDraft(){
  if(!S || !S.job || S.editId) return; // never autosave over an edit of an already-submitted booking
  try{ localStorage.setItem(draftKey(S.job.id), JSON.stringify({ savedAt: Date.now(), S })); }catch(e){}
}
function clearFormDraft(scheduleId){ try{ localStorage.removeItem(draftKey(scheduleId)); }catch(e){} }

function openForm(scheduleId){
  const j=jobsForMyTeam().find(x=>String(x.id)===String(scheduleId));
  if(!j){ toast('ไม่พบงานนี้'); return; }
  const draft=loadFormDraft(scheduleId);
  if(draft){ S=draft; toast('กู้คืนแบบฟอร์มที่กรอกค้างไว้ให้แล้ว'); renderForm(); return; }
  S={ editId:null, job:j, manualProv:null, checkin:j.start, checkout:j.end,
      hotelPicks:[], addingHotel:false, newHotelDraft:{n:'',map:'',p:''}, f:0, m:0, slots:[], note:"", busy:false };
  renderForm();
}
function openAdhocForm(){
  const draft=loadFormDraft(null);
  if(draft){ S=draft; toast('กู้คืนแบบฟอร์มที่กรอกค้างไว้ให้แล้ว'); renderForm(); return; }
  S={ editId:null, job:{ id:null, branchCode:'', branch:'', prov:null, start:'', end:'', adv:0, blat:null, blng:null, adhoc:true },
      manualProv:null, checkin:'', checkout:'', hotelPicks:[], addingHotel:false,
      newHotelDraft:{n:'',map:'',p:''}, f:0, m:0, slots:[], note:"", missionType:'', missionNote:'', busy:false };
  renderForm();
}
function setMissionType(v){
  S.missionType=v;
  if(v!=='อื่นๆ') S.missionNote='';
  rerender(renderForm);
}
function openFormEdit(id){
  const b=findB(id); if(!b){ toast('ไม่พบการจองนี้'); return; }
  const stored = b.guestList || [];
  const slots = [];
  stored.filter(g=>g.g==='f').forEach((g,i)=>slots.push({ g:'f', idx:i, team:g.team||ME.team_code, code:g.code||'', name:g.name, phone:g.phone||'', manual:!g.code }));
  stored.filter(g=>g.g==='m').forEach((g,i)=>slots.push({ g:'m', idx:i, team:g.team||ME.team_code, code:g.code||'', name:g.name, phone:g.phone||'', manual:!g.code }));
  S={ editId:b.id,
      job:{ id:b.jobId, branchCode:b.branchCode, branch:b.branch, prov:b.prov,
            start:'', end:'', adv:0, blat:b.blat, blng:b.blng, adhoc:!b.jobId },
      manualProv:b.prov, checkin:b.checkin, checkout:b.checkout,
      // Re-point each saved choice back at the live registry entry so the picker highlights it.
      hotelPicks: b.hotels.map(h=>{
        if(h.custom) return { code:'CUSTOM-'+h.id, name:h.name, map:h.map, price:h.price, custom:true };
        return HOTELS.find(x=>x.name===h.name) || { code:'REG-'+h.id, name:h.name, price:h.price, near:h.near };
      }),
      addingHotel:false, newHotelDraft:{n:'',map:'',p:''},
      f: stored.filter(g=>g.g==='f').length,
      m: stored.filter(g=>g.g==='m').length,
      slots, note:b.note||"", missionType:b.missionType||'', missionNote:b.missionNote||'', busy:false };
  renderForm();
}
function bookingGuestList(id){ const b=findB(id); return (b && b.guestList) || []; }

// v2 §8.5 item 3 — "จองเหมือนครั้งก่อน": real data shows the same team returns to
// the same branch, same hotel, same people repeatedly. Copies guests + hotel
// picks + note from the most recent completed booking at this branch; the
// employee still has to pick fresh dates themselves.
function findLastBookingForBranch(branchCode){
  return BOOKINGS
    .filter(b=>b.branchCode===branchCode && b.status==='จองสำเร็จ' && (b.guestList||[]).length)
    .sort((a,b)=>new Date(b.checkin)-new Date(a.checkin))[0] || null;
}
function copyFromLastBooking(){
  const last=findLastBookingForBranch(S.job.branchCode);
  if(!last){ toast('ไม่พบการจองก่อนหน้าที่สาขานี้'); return; }
  const stored=last.guestList||[];
  const slots=[];
  stored.filter(g=>g.g==='f').forEach((g,i)=>slots.push({ g:'f', idx:i, team:g.team||ME.team_code, code:g.code||'', name:g.name, phone:g.phone||'', manual:!g.code }));
  stored.filter(g=>g.g==='m').forEach((g,i)=>slots.push({ g:'m', idx:i, team:g.team||ME.team_code, code:g.code||'', name:g.name, phone:g.phone||'', manual:!g.code }));
  S.f=stored.filter(g=>g.g==='f').length;
  S.m=stored.filter(g=>g.g==='m').length;
  S.slots=slots;
  S.hotelPicks=last.hotels.map(h=>{
    if(h.custom) return { code:'CUSTOM-'+h.id, name:h.name, map:h.map, price:h.price, custom:true };
    return HOTELS.find(x=>x.name===h.name) || { code:'REG-'+h.id, name:h.name, price:h.price, near:h.near };
  });
  S.note=last.note||'';
  toast('คัดลอกผู้เข้าพัก+ที่พักจากครั้งก่อนแล้ว — ตรวจสอบก่อนส่งด้วยนะ');
  rerender(renderForm);
}

function setManualProv(v){ S.manualProv=v; rerender(renderForm); }
function setAdhocBranch(code){
  const b=BRANCH_BY_CODE[code]; if(!b) return;
  S.job.branchCode=b.code; S.job.branch=b.name; S.job.prov=b.province;
  S.job.blat=b.lat!=null?Number(b.lat):null; S.job.blng=b.lng!=null?Number(b.lng):null;
  rerender(renderForm);
}
function resetAdhocBranch(){ S.job.branchCode=''; S.job.branch=''; S.job.prov=null; S.job.blat=null; S.job.blng=null; rerender(renderForm); }
function rebuildSlots(){
  const s=[];
  for(let i=0;i<S.f;i++) s.push(S.slots.find(x=>x.g==='f'&&x.idx===i) || {g:'f',idx:i,team:ME.team_code,code:'',name:'',phone:'',manual:false});
  for(let i=0;i<S.m;i++) s.push(S.slots.find(x=>x.g==='m'&&x.idx===i) || {g:'m',idx:i,team:ME.team_code,code:'',name:'',phone:'',manual:false});
  S.slots=s;
}
function collectGuests(){ return S.slots.map(s=>({ g:s.g, idx:s.idx, team:s.team, code:s.code, name:s.name, phone:s.phone })); }
function chCount(g,d){ S[g]=Math.max(0,S[g]+d); rerender(renderForm); }
function toggleHotel(code){
  const h=HOTELS.find(x=>x.code===code); if(!h) return;
  const i=S.hotelPicks.findIndex(x=>x.code===h.code);
  if(i>=0) S.hotelPicks.splice(i,1);
  else { if(S.hotelPicks.length>=3){ toast('เลือกได้สูงสุด 3 ที่พัก'); return; } S.hotelPicks.push(h); }
  rerender(renderForm);
}
function removeHotelPick(code){ const i=S.hotelPicks.findIndex(x=>x.code===code); if(i>=0)S.hotelPicks.splice(i,1); rerender(renderForm); }
function toggleAddHotelForm(){ S.addingHotel=!S.addingHotel; S.newHotelDraft={n:'',map:'',p:''}; rerender(renderForm); }
function setNewHotelField(k,v){ if(!S.newHotelDraft)S.newHotelDraft={n:'',map:'',p:''}; S.newHotelDraft[k]=v; }
function confirmNewHotel(){
  const d=S.newHotelDraft||{};
  if(!d.n || !d.p){ toast('กรอกชื่อที่พักและราคาก่อน'); return; }
  if(S.hotelPicks.length>=3){ toast('เลือกได้สูงสุด 3 ที่พัก'); return; }
  S.hotelPicks.push({ code:'NEW'+Date.now(), name:d.n, map:d.map||'', price:parseInt(d.p,10)||0, custom:true });
  S.addingHotel=false; S.newHotelDraft={n:'',map:'',p:''};
  rerender(renderForm);
}
function setSlotTeam(i,v){ S.slots[i].team=v; S.slots[i].code=''; S.slots[i].name=''; S.slots[i].phone=''; S.slots[i].manual=false; rerender(renderForm); }
function setSlotCode(i,v){
  if(v==='__manual__'){ S.slots[i].code=''; S.slots[i].manual=true; S.slots[i].name=''; S.slots[i].phone=''; }
  else{
    S.slots[i].code=v; S.slots[i].manual=false;
    const st=STAFF[v];
    if(st){ S.slots[i].name=st.name+' ('+nickOf(st)+')'; S.slots[i].phone=st.phone||''; }
  }
  rerender(renderForm);
}
function setSlotManualField(i,k,v){ S.slots[i][k]=v; } // silent — typing must never re-render

function renderForm(){
  const j=S.job;
  const effProv = S.manualProv || j.prov;
  rebuildSlots();
  checkHomeDistanceIfNeeded();

  const hc = S.homeCheck;
  // Uses the app's own real --amber/--amber-soft tokens (same ones .warn.a
  // already uses elsewhere) — an earlier pass of this card used hex values
  // borrowed from an unrelated design doc that was never actually deployed.
  const homeWarnCard = (hc && hc.loading) ? `
    <div class="hint" style="margin:-2px 0 10px">กำลังตรวจสอบระยะทางจากบ้าน…</div>` :
    (hc && hc.km!=null && hc.km<HOME_DISTANCE_WARN_KM) ? `
    <div class="card" style="background:var(--amber-soft);border-color:var(--amber)">
      <div class="label" style="color:#8a6200">⚠ บ้านอยู่ใกล้สาขานี้มาก</div>
      <div style="font-weight:600;font-size:13.5px">บ้านของคุณห่างจากสาขานี้แค่ ${hc.km} กม. (ขับรถจริง ~${hc.min} นาที)</div>
      <div class="hint" style="margin-top:4px">ลองพิจารณากลับบ้านแทนการขอที่พักไหม — ถ้ายังจำเป็นต้องพัก กรุณาระบุเหตุผลไว้ด้วย</div>
      <div class="label" style="margin-top:10px">เหตุผลที่ยังต้องขอที่พัก</div>
      <textarea class="txt" placeholder="เช่น ต้องอยู่เตรียมงานตั้งแต่เช้ามืด" oninput="setHomeCheckReason(this.value)">${esc(hc.reason||'')}</textarea>
    </div>` :
    (hc && hc.km!=null) ? `
    <div class="hint" style="margin:-2px 0 10px">บ้านของคุณห่างจากสาขานี้ ${hc.km} กม. (ขับรถจริง ~${hc.min} นาที)</div>` :
    (ME && ME.home_lat!=null && !hasBranchCoords(j)) ? `
    <div class="hint" style="margin:-2px 0 10px">สาขานี้ยังไม่มีพิกัดในทะเบียน — ยังเทียบระยะทางจากบ้านไม่ได้</div>` : '';

  // Empty state per requirement doc §12-13: shown any time the employee has no
  // home coordinates yet, independent of which branch/screen they're on — set
  // once, used by every future booking. Self-service, no admin step.
  const homeAddrCard = (ME && ME.home_lat==null) ? `
    <div class="card">
      <div class="label">ยังไม่มีข้อมูลที่อยู่บ้านของคุณ</div>
      <div class="hint" style="margin-bottom:8px">กรอกครั้งเดียว ใช้ได้ทุกครั้งที่ขอที่พัก — เปิด Google Maps ปักหมุดตำแหน่งบ้าน แล้วกดแชร์ลิงก์มาวางที่นี่</div>
      <input class="txt" placeholder="วางลิงก์ Google Maps หรือพิกัด เช่น 13.7563,100.5018" value="${esc(S.homeLinkDraft||'')}" oninput="setHomeLinkDraft(this.value)"/>
      <button class="btn ghost" style="margin-top:8px" onclick="saveHomeLocation()">บันทึกตำแหน่งบ้าน</button>
    </div>` : '';

  const showMap = hasBranchCoords(j) || S.hotelPicks.some(h=>h.lat!=null);
  const mapCard = showMap ? `<div class="card" style="padding:10px">
      <div class="label" style="margin-bottom:8px">แผนที่ตำแหน่ง</div>
      <div id="bookingMap" style="height:220px;border-radius:10px;overflow:hidden;background:var(--paper)"></div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted)">
        ${hasBranchCoords(j)?`<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:4px"></span>สาขา</span>`:''}
        ${S.hotelPicks.some(h=>h.lat!=null)?`<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);margin-right:4px"></span>ที่พักที่เลือก</span>`:''}
      </div></div>` : '';

  const needProvPicker = !effProv && (!j.adhoc || j.branchCode);
  const provPicker = needProvPicker ? `<div class="card"><div class="label">⚠️ สาขานี้ยังไม่มีจังหวัดในทะเบียน — เลือกจังหวัดเอง</div>
    <select class="txt" onchange="setManualProv(this.value)">
     <option value="">— เลือกจังหวัด —</option>
     ${PROVINCES.map(p=>`<option value="${esc(p)}" ${S.manualProv===p?'selected':''}>${esc(p)}</option>`).join("")}
    </select></div>` : '';

  const byProv={};
  BRANCHES.forEach(b=>{ const k=b.province||'ยังไม่ระบุจังหวัด'; (byProv[k]=byProv[k]||[]).push(b); });
  const branchPicker = (j.adhoc && !j.branchCode) ? `<div class="card"><div class="label">เลือกสาขาที่จะไป</div>
    <select class="txt" onchange="setAdhocBranch(this.value)">
     <option value="">— เลือกสาขา —</option>
     ${Object.keys(byProv).sort().map(p=>`<optgroup label="จ.${esc(p)}">${byProv[p].map(b=>`<option value="${esc(b.code)}">${esc(b.name)}</option>`).join("")}</optgroup>`).join("")}
    </select></div>` : '';

  const lastBooking = (!S.editId && j.branchCode) ? findLastBookingForBranch(j.branchCode) : null;
  const repeatBtn = lastBooking ? `<button class="btn ghost" style="margin-top:8px" onclick="copyFromLastBooking()">🔁 จองเหมือนครั้งก่อน (${fmtDate(lastBooking.checkin)})</button>` : '';
  const branchCard = j.adhoc
    ? (j.branchCode ? `<div class="card"><div class="label">สาขาที่จะไป</div>
        <div class="val" style="font-size:14px">${esc(j.branch)}${j.prov?(' · จ.'+esc(j.prov)):''}</div>
        <div class="hint" style="margin-top:6px;cursor:pointer;color:var(--brand);font-weight:700" role="button" tabindex="0" onclick="resetAdhocBranch()" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();resetAdhocBranch()}">เปลี่ยนสาขา</div>${repeatBtn}</div>` : '')
    : `<div class="card"><div class="label">สาขาที่ต้องไป (จากแผนงาน)</div><div class="val" style="font-size:14px">${esc(j.branch)}</div>
       ${j.start?`<div class="hint" style="margin:4px 0 0">งาน ${fmtDate(j.start)}–${fmtDate(j.end)}${j.adv?` · ควรเข้าก่อน ${j.adv} วัน`:''}</div>`:''}${repeatBtn}</div>`;

  const missionCard = j.adhoc ? `<div class="card"><div class="label">ประเภทภารกิจ (จำเป็น)</div>
    <div class="chips">${MISSION_TYPES.map(t=>`<div class="chip ${S.missionType===t?'sel':''}" role="radio" aria-checked="${S.missionType===t}" tabindex="0"
      onclick="setMissionType('${esc(t)}')"
      onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();setMissionType('${esc(t)}')}">${esc(t)}</div>`).join("")}</div>
    ${S.missionType==='อื่นๆ'?`<div class="label" style="margin-top:10px">ระบุประเภทภารกิจ</div>
      <input class="txt" placeholder="ระบุสั้นๆ" value="${esc(S.missionNote||'')}" oninput="S.missionNote=this.value"/>`:''}
    </div>` : '';

  // Same province is always eligible (no distance cap); a hotel in a different
  // province is only eligible within NEARBY_KM of the branch — needs the branch's
  // own coordinates to check, so falls back to the old province-only list when
  // the branch has none.
  const NEARBY_KM = 30;
  let list;
  if (hasBranchCoords(j)) {
    list = HOTELS
      .map(h => Object.assign({}, h, { _km: roadKm(haversine(j.blat, j.blng, h.lat, h.lng)) }))
      .filter(h => h.prov === effProv || (h._km != null && h._km <= NEARBY_KM))
      .sort((a,b) => (a._km==null?9999:a._km) - (b._km==null?9999:b._km));
  } else {
    list = (effProv ? HOTELS.filter(h=>h.prov===effProv) : []).slice()
      .sort((a,b)=>(a.price==null?9999:a.price)-(b.price==null?9999:b.price));
  }
  const renderHotelRow = (h) => {
    const sel=S.hotelPicks.some(x=>x.code===h.code);
    const dist = h._km!=null ? `ห่าง ~${h._km.toFixed(1)} กม.` : (h.near?('ใกล้ '+esc(h.near)):'');
    const provTag = h.prov && h.prov!==effProv ? ` · จ.${esc(h.prov)}` : '';
    return `<div class="hotel ${sel?'sel':''}" role="checkbox" aria-checked="${sel}" tabindex="0"
        onclick="toggleHotel('${esc(h.code)}')"
        onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggleHotel('${esc(h.code)}')}">
      <div class="chk">${sel?'✓':''}</div>
      <div class="n"><div class="t">${esc(h.name)}</div><div class="s">${dist}${provTag}${h.choowap?' · Choowap':''} ${mapLinkBtn(h.mapLink)}</div></div>
      <div class="p">${h.price!=null?h.price+'฿<br><small style="font-weight:500;opacity:.7">/ห้อง/คืน</small>':'—'}</div></div>`;
  };
  // Grouped by distance so a 30+ item list isn't one undifferentiated scroll —
  // near options (the ones that matter most) show immediately, farther ones
  // are one tap away via a native <details> (free keyboard + screen-reader
  // support, no extra JS). Only meaningful when we actually have distances;
  // the province-only fallback list stays flat since it's price-sorted, not
  // distance-sorted, and grouping by an absent number would be arbitrary.
  let hotelHtml;
  if (hasBranchCoords(j)) {
    const near = list.filter(h => h._km==null || h._km<=10);
    const far = list.filter(h => h._km!=null && h._km>10);
    const nearHtml = near.map(renderHotelRow).join("");
    const farHtml = far.length ? `<details ${near.length?'':'open'} style="margin-top:4px">
        <summary class="disclosure">ที่พักไกลกว่า 10 กม. (${far.length} แห่ง) — แตะเพื่อดู</summary>
        ${far.map(renderHotelRow).join("")}
      </details>` : '';
    hotelHtml = nearHtml + farHtml;
  } else {
    hotelHtml = list.map(renderHotelRow).join("");
  }

function renderBookingMap(){
  const el = document.getElementById('bookingMap');
  if (window._bookingMap) { window._bookingMap.remove(); window._bookingMap = null; }
  if (!el || typeof L === 'undefined') return;
  const map = L.map(el, { zoomControl:false, attributionControl:true, dragging:false,
    scrollWheelZoom:false, touchZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false });
  window._bookingMap = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:18, attribution:'© OpenStreetMap'
  }).addTo(map);

  const pts = [];
  function pin(lat, lng, label, color, title){
    if (lat==null || lng==null || lat===0 || lng===0) return;
    const icon = L.divIcon({
      className:'',
      html:`<div role="img" aria-label="${esc(title||'')}" style="width:26px;height:26px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)">${label}</div>`,
      iconSize:[26,26], iconAnchor:[13,13]
    });
    L.marker([lat,lng], {icon}).addTo(map);
    pts.push([lat,lng]);
  }
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const j = S.job;
  if (hasBranchCoords(j)) pin(j.blat, j.blng, '🏪', cssVar('--brand'), 'สาขา '+(j.branch||''));
  S.hotelPicks.forEach(h => { if (h.lat!=null) pin(h.lat, h.lng, '🏨', cssVar('--amber'), 'ที่พัก '+(h.name||'')); });

  if (pts.length > 1) map.fitBounds(pts, { padding:[28,28] });
  else if (pts.length === 1) map.setView(pts[0], 14);
  else map.setView([13.75,100.5], 6);
}

// Admin exception-flow map (booking-prep screen): branch + every submitted hotel
// choice (grey/struck-through if marked unavailable) + up to 3 suggested
// alternatives as green pins with a one-tap "choose instead" popup.
function renderAdminMap(b, suggestions){
  const el = document.getElementById('adminMap');
  if (window._adminMap) { window._adminMap.remove(); window._adminMap = null; }
  if (!el || typeof L === 'undefined') return;
  const map = L.map(el, { zoomControl:false, attributionControl:true, dragging:false,
    scrollWheelZoom:false, touchZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false });
  window._adminMap = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:18, attribution:'© OpenStreetMap'
  }).addTo(map);

  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const pts = [];
  function pin(lat, lng, label, color, opts, title){
    if (lat==null || lng==null || lat===0 || lng===0) return;
    const icon = L.divIcon({
      className:'',
      html:`<div role="img" aria-label="${esc(title||'')}" style="width:26px;height:26px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)">${label}</div>`,
      iconSize:[26,26], iconAnchor:[13,13]
    });
    const mk = L.marker([lat,lng], {icon});
    if (opts && opts.popup) mk.bindPopup(opts.popup);
    mk.addTo(map);
    pts.push([lat,lng]);
  }
  if (hasBranchCoords(b)) pin(b.blat, b.blng, '🏪', cssVar('--brand'), null, 'สาขา '+(b.branch||''));
  (b.hotels||[]).forEach(h => {
    if (h.lat==null) return;
    pin(h.lat, h.lng, h.unavailable ? '🚫' : '🏨', h.unavailable ? '#9a9a9a' : cssVar('--amber'), null, (h.unavailable?'ที่พักเต็มแล้ว ':'ที่พัก ')+(h.name||''));
  });
  (suggestions||[]).forEach(h => {
    if (h.lat==null) return;
    const popup = `<div style="font-size:12.5px"><strong>${esc(h.name)}</strong><br>${h.price!=null?h.price+'฿':''}
      <br><button class="btn" style="margin-top:6px;padding:6px 10px;font-size:12px" onclick="addHotelChoiceForBooking('${b.id}','${esc(h.code)}')">เลือกที่นี่แทน</button></div>`;
    pin(h.lat, h.lng, '⭐', cssVar('--success'), { popup }, 'ที่พักแนะนำ '+(h.name||''));
  });

  if (pts.length > 1) map.fitBounds(pts, { padding:[28,28] });
  else if (pts.length === 1) map.setView(pts[0], 14);
  else map.setView([13.75,100.5], 6);
}

async function submitBooking(){
  if(S.busy) return;
  const guests=collectGuests();
  const payload = {
    branch_code: S.job.branchCode,
    work_schedule_id: S.job.adhoc ? null : S.job.id,
    checkin_date: S.checkin,
    checkout_date: S.checkout,
    note: S.note||'',
    mission_type: S.job.adhoc ? (S.missionType||null) : null,
    mission_type_note: S.job.adhoc && S.missionType==='อื่นๆ' ? (S.missionNote||null) : null,
    home_distance_reason: (S.homeCheck && S.homeCheck.reason) || null,
    guests: guests.map(g=>({
      team_code: g.team, employee_code: g.code||null,
      name: g.name, phone: g.phone||null, gender: g.g==='f' ? 'F' : 'M'
    })),
    hotel_choices: S.hotelPicks.map(h=>(
      h.custom
        ? { hotel_id:null, custom_name:h.name, custom_map_link:h.map||null, custom_price:h.price||null }
        : { hotel_id: hotelIdByCode(h.code), custom_price:null }
    ))
  };
  S.busy=true; rerender(renderForm);
  try{
    if(S.editId){
      await apiSend('/bookings','PATCH', Object.assign({ booking_id:S.editId, action:'edit' }, payload));
      toast('ส่งคำขอที่แก้ไขแล้ว ✓');
    }else{
      const r = await apiSend('/bookings','POST', Object.assign({ action:'create' }, payload));
      if(r.warnings && r.warnings.length) toast('ส่งคำขอแล้ว — แต่มีคนจองซ้อนวัน: '+r.warnings[0]);
      else toast('ส่งคำขอให้แอดมินแล้ว ✓');
    }
    clearFormDraft(S.job.adhoc ? null : S.job.id);
    await reloadBookings(false);
    const target = S.editId || (BOOKINGS[0] && BOOKINGS[0].id);
    S.busy=false;
    if(target) renderStatus(target); else goHome();
  }catch(e){
    S.busy=false;
    toast(e.message);
    rerender(renderForm);
  }
}
function hotelIdByCode(code){
  const h = HOTELS.find(x=>x.code===code);
  return h ? h.id : null;
}

// Looks for any sheet other than "แผนงาน" that pairs a job-type column with an
// advance-days column (header containing "จองก่อน" or "เข้าพักก่อน") — the exact
// sheet name/wording varies between uploads, so match by header shape, not name.
function findAdvanceDaysLookup(wb){
  const map={};
  for(const name of wb.SheetNames){
    if(name==='แผนงาน') continue;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{ defval:'' });
    if(!rows.length) continue;
    const keys=Object.keys(rows[0]);
    const typeKey=keys.find(k=>k.includes('ประเภทงาน'));
    const daysKey=keys.find(k=>k.includes('จองก่อน')||k.includes('เข้าพักก่อน'));
    if(!typeKey||!daysKey) continue;
    rows.forEach(r=>{
      const type=String(r[typeKey]||'').trim();
      const days=parseInt(r[daysKey],10);
      if(type && Number.isInteger(days)) map[type]=days;
    });
  }
  return map;
}

function onScheduleFileChosen(evt){
  const file=evt.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(e.target.result,{ type:'array', cellDates:true });
      const sheetName=wb.SheetNames.includes('แผนงาน')?'แผนงาน':wb.SheetNames[0];
      const ws=wb.Sheets[sheetName];
      const rows=XLSX.utils.sheet_to_json(ws,{ defval:'' });
      const advanceDaysByType=findAdvanceDaysLookup(wb);
      IMPORT_PREVIEW=rows.map(r=>{
        const missionType=String(r['ประเภทงาน']||'').trim();
        const looked=advanceDaysByType[missionType];
        return {
          team_code:String(r['ทีม']||'').trim(),
          branch_code:String(r['รหัสสาขา']||'').trim(),
          date_start:toIsoDateFromExcel(r['วันที่เริ่มงาน']),
          date_end:toIsoDateFromExcel(r['วันที่จบงาน']),
          mission_type:missionType,
          advance_days:Number.isInteger(looked)?looked:0,
          advance_days_matched:Number.isInteger(looked)
        };
      }).filter(r=>r.team_code||r.branch_code||r.date_start||r.date_end);
      IMPORT_FILENAME=file.name;
      renderImportPreview();
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function toIsoDateFromExcel(v){
  // SheetJS's cellDates:true builds the Date from the serial number using the
  // LOCAL-time constructor (new Date(y,m,d)), not UTC — so for any browser in
  // a positive UTC-offset timezone (Thailand included), reading it back with
  // getUTC*() rolls the date back by one. Local getters match how it was built.
  if(v instanceof Date) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  return '';
}

function parseLatLngFromMapsUrl(url){
  const s=String(url||'');
  let m=s.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(!m) m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  return m ? { lat:parseFloat(m[1]), lng:parseFloat(m[2]) } : { lat:null, lng:null };
}

function onBranchFileChosen(evt){
  const file=evt.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{

      const wb=XLSX.read(e.target.result,{ type:'array' });
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{ defval:'' });
      BRANCH_IMPORT_PREVIEW=rows.map(r=>{
        const { lat, lng }=parseLatLngFromMapsUrl(r['Google Maps']);
        return {
          code:String(r['CJX Store Code']||'').trim(),
          name:String(r['ชื่อสาขา']||'').trim(),
          district:String(r['อำเภอ']||'').trim(),
          province:String(r['จังหวัด']||'').trim(),

      }).filter(r=>r.code);

      renderBranchPreview();
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}

const URGENT_TYPE_INFO = {

function urgentDaysTag(d){
  if(d<0) return `<span class="pill soon">เลยกำหนด ${-d} วัน</span>`;
  if(d===0) return `<span class="pill soon">วันนี้</span>`;

  $("#app").innerHTML=`<div class="screen"><div class="appbar"><span class="back" onclick="renderAdminQueue()">‹</span><h1>🔥 ต้องรีบดูตอนนี้</h1></div>

  try{
    const d=await apiGet('/admin-import?action=urgent_now&actor='+encodeURIComponent(ME.code));

      // not_booked items have no booking yet, so there's nothing to open —
      // they used to render as a cursor:pointer row with no onclick at all

      // applies: nudge the team, same button used on "แผนงานที่ยังไม่จอง".
      const action = onClick

        ${action}</div>`;
    }).join('');
    $("#app").innerHTML=`<div class="screen"><div class="appbar"><span class="back" onclick="renderAdminQueue()">‹</span>

  done:            { label:'จองสำเร็จ',                cls:'ok' },
  needs_fix:       { label:'ต้องแก้ไข',                cls:'soon' },

function renderScheduleFlowList(rows){
  const order=['awaiting_area','not_booked','awaiting_admin','admin_processing','needs_fix','problem','done'];
  const sorted=rows.slice().sort((a,b)=>(order.indexOf(a.stage)-order.indexOf(b.stage)) || (a.date_start<b.date_start?-1:1));
  const counts={};
  rows.forEach(r=>{ counts[r.stage]=(counts[r.stage]||0)+1; });
  const summary = order.filter(s=>counts[s]).map(s=>`<span class="pill ${SCHEDULE_STAGE_INFO[s].cls}">${esc(SCHEDULE_STAGE_INFO[s].label)} ${counts[s]}</span>`).join(' ');
  const listRows = sorted.map(r=>{
    const info = SCHEDULE_STAGE_INFO[r.stage] || SCHEDULE_STAGE_INFO.unknown;
    return `<div class="job">
      <div class="g"><div class="t">${esc(r.branch_name)}</div>
       <div class="s">${esc(r.team_code)} · ${fmtDate(r.date_start)}–${fmtDate(r.date_end)}</div>
       <div style="margin-top:5px"><span class="pill ${info.cls}">${esc(info.label)}</span></div></div>
     </div>`;
  }).join('');
  $("#app").innerHTML=`<div class="screen"><div class="appbar"><span class="back" onclick="renderAdminQueue()">‹</span>
    <div style="flex:1"><h1>ภาพรวมทุกแผนงาน</h1><span class="sub">${rows.length} รายการ</span></div></div>
   <div class="body">
    <div class="card" style="display:flex;gap:6px;flex-wrap:wrap">${summary}</div>
    ${listRows||'<div class="hint">ยังไม่มีแผนงาน</div>'}
   </div></div>`;
}

    const order=['not_booked','awaiting_area','awaiting_admin','admin_processing','needs_fix','problem','done'];

    const sorted=rows.slice().sort((a,b)=>(order.indexOf(a.stage)-order.indexOf(b.stage)) || (a.date_start<b.date_start?-1:1));
    const counts={};
    rows.forEach(r=>{ counts[r.stage]=(counts[r.stage]||0)+1; });
    const summary = order.filter(s=>counts[s]).map(s=>`<span class="pill ${SCHEDULE_STAGE_INFO[s].cls}">${esc(SCHEDULE_STAGE_INFO[s].label)} ${counts[s]}</span>`).join(' ');
    const listRows = sorted.map(r=>{
      const info = SCHEDULE_STAGE_INFO[r.stage] || SCHEDULE_STAGE_INFO.unknown;
      return `<div class="job">
        <div class="g"><div class="t">${esc(r.branch_name)}</div>
         <div class="s">${esc(r.team_code)} · ${fmtDate(r.date_start)}–${fmtDate(r.date_end)}</div>
         <div style="margin-top:5px"><span class="pill ${info.cls}">${esc(info.label)}</span></div></div>
       </div>`;
    }).join('');
    $("#app").innerHTML=`<div class="screen"><div class="appbar"><span class="back" onclick="renderAreaQueue()">‹</span>
      <div style="flex:1"><h1>งานของทีมที่ดูแล</h1><span class="sub">${rows.length} รายการ</span></div></div>
     <div class="body">
      <div class="hint">ดูว่ามีงานของทีมที่ดูแลค้างอยู่ขั้นไหนบ้าง — รวมงานที่ยังไม่มีคำขอเข้ามาเลย</div>
      <div class="card" style="display:flex;gap:6px;flex-wrap:wrap">${summary}</div>
      ${listRows||'<div class="hint">ไม่มีแผนงานสำหรับทีมที่ดูแล</div>'}
     </div></div>`;
  }catch(e){ toast('โหลดไม่สำเร็จ: '+e.message); renderAreaQueue(); }
}

  btn.style.borderColor='var(--danger)';

async function deleteSchedule(id,btn){

function renderAdminDetail(id){
  const b=findB(id); if(!b){ toast('ไม่พบการจองนี้'); renderAdminQueue(); return; }
  const guests=bookingGuestList(id);
  const rooms=pair(guests);
  const nights=daysBetween(b.checkin,b.checkout)||1;
  const chosen=b.hotels.find(h=>h.id===b.chosenChoiceId)||null;
  const cost=chosen?(chosen.price||0)*rooms.length*nights:0;
  const hasBCoords = hasBranchCoords(b);
  const hotelsWithDist = b.hotels.map(h => Object.assign({}, h, { _km: hotelDistanceKm(h,b) }));
  const anyUnavailable = hotelsWithDist.some(h=>h.unavailable);
  // Only surface once something's actually unavailable — the admin asked for
  // alternatives, not a second opinion on choices that are still fine.
  const NEARBY_KM = 30;
  const usedCodes = new Set(b.hotels.filter(h=>h.code).map(h=>h.code));
  const suggestions = (anyUnavailable && hasBCoords)
    ? HOTELS.filter(h => !usedCodes.has(h.code))
        .map(h => Object.assign({}, h, { _km: roadKm(haversine(b.blat,b.blng,h.lat,h.lng)) }))
        .filter(h => h.prov===b.prov || (h._km!=null && h._km<=NEARBY_KM))
        .sort((x,y)=>(x._km==null?9999:x._km)-(y._km==null?9999:y._km))
        .slice(0,3)
    : [];
  const hotelSubtitle = h => {
    const base = h._km!=null ? `ห่างจากสาขา ~${h._km.toFixed(1)} กม.`
      : h.custom ? 'ไม่มีข้อมูลระยะทาง' : esc(h.near||'-');
    const fixLink = (h.custom && h._km==null) ? ` <a onclick="event.stopPropagation();promptUpdateHotelLink('${esc(h.id)}','${esc(b.id)}',false)" style="color:var(--brand);cursor:pointer;font-weight:700;text-decoration:none">+ เพิ่มลิงก์</a>` : '';
    return `${base}${fixLink} ${mapLinkBtn(h.map)}`;
  };
  const rc=rooms.map((r,k)=>{
    const nm=r.p.map(p=>esc(p.name||'(ไม่ระบุชื่อ)')).join(", ");
    const e=r.p.length<2?`<div class="empty">+ ว่าง 1 เตียง</div>`:"";
    return `<div class="room ${r.g}"><div class="rh"><span>ห้อง ${k+1}</span><span>${r.g==='f'?'หญิง':'ชาย'}</span></div><div class="oc">${nm}</div>${e}</div>`;
  }).join("");
  const guestRows=guests.map(g=>`<div class="guestcard">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span class="gt ${g.g}">${g.g==='f'?'ญ':'ช'}</span><strong style="font-size:12px">${esc(g.team||'')}</strong></div>
    <div class="copyrow"><span class="k">รหัส</span><span class="v">${esc(g.code||'—')}</span>${copyChip(`'${esc(g.code||'')}'`)}</div>
    <div class="copyrow"><span class="k">ชื่อจริง</span><span class="v">${esc(g.name||'—')} ${guestHomeDistanceTag(g,b)}</span>${copyChip(`'${esc(g.name||'')}'`)}</div>
    <div class="copyrow"><span class="k">เบอร์</span><span class="v">${esc(g.phone||'—')}</span>${copyChip(`'${esc(g.phone||'')}'`)}</div>
   </div>`).join("");
  const hotelRadios=hotelsWithDist.map(h=>{
    const provTag = h.prov && h.prov!==b.prov ? ` · จ.${esc(h.prov)}` : '';
    if (h.unavailable) return `<div class="hotel radio" style="opacity:.55">
      <div class="chk"></div>
      <div class="n"><div class="t" style="text-decoration:line-through">${esc(h.name)}</div><div class="s">จองไม่ได้ (เต็ม)${provTag}</div></div>
      <div class="p">${h.price!=null?h.price+'฿':'—'}</div></div>`;
    return `<div class="hotel radio ${b.chosenChoiceId===h.id?'sel':''}" onclick="chooseHotel('${b.id}','${h.id}')">
    <div class="chk">${b.chosenChoiceId===h.id?'✓':''}</div>
    <div class="n"><div class="t">${esc(h.name)}</div><div class="s">${hotelSubtitle(h)}${provTag}</div></div>
    <div class="p">${h.price!=null?h.price+'฿':'—'}</div>

// BOOKINGS is already server-filtered to this approver's assigned teams
// (scope=area in reloadBookings), so this queue is just renderAdminQueue's
// list-card pattern reused as-is with a narrower title and no admin-only links.
function renderAreaQueue(){
  const order={'ส่งคำขอ':0,'อนุมัติพื้นที่แล้ว':1,'ดำเนินการจอง':2,'ติดปัญหา':3,'ต้องแก้ไข':4,'จองสำเร็จ':5};
  const pending = BOOKINGS.filter(b=>b.status==='ส่งคำขอ');
  const sorted=BOOKINGS.slice().sort((a,b)=>(order[a.status]??9)-(order[b.status]??9));
  const rows=sorted.map(b=>{
    const d=b.derived||{};
    return `<div class="job" role="button" tabindex="0" onclick="renderAreaDetail('${b.id}')" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();renderAreaDetail('${b.id}')}">
     <div class="d" style="background:var(--amber-soft);color:var(--amber)">${d.people||0}<small>คน</small></div>
     <div class="g"><div class="t">${esc(b.branch)}</div>
      <div class="s">${esc(b.team)} · ${fmtDate(b.checkin)}–${fmtDate(b.checkout)}</div>
      <div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap">${pillOf(b)}</div></div><div class="chev">›</div></div>`;
  }).join("");
  $("#app").innerHTML=`<div class="screen"><div class="appbar">
    <div style="flex:1"><h1>รอตรวจอนุมัติพื้นที่</h1><span class="sub">${esc(nickOf(ME))} · ${BOOKINGS.length} รายการ</span></div></div>
   <div class="body">
    <div class="card"><div style="display:flex;justify-content:space-around;text-align:center">
     <div><div class="val" style="color:var(--amber)">${pending.length}</div><div class="label" style="margin:0">รอตรวจ</div></div>
     <div><div class="val" style="color:var(--success)">${BOOKINGS.length-pending.length}</div><div class="label" style="margin:0">ผ่านไปแล้ว</div></div>
    </div></div>
    <div class="hint">ตรวจสอบความถูกต้องของพนักงานที่จะเข้าพัก ก่อนส่งต่อให้แอดมินจองจริง</div>
    ${rows||'<div class="hint">ยังไม่มีคำขอรอตรวจ</div>'}

    <a class="navlink" onclick="renderJoinBrowse()">มีเพื่อนไปด้วยกันไหม? ดูห้องที่มีเตียงว่าง</a>
   </div></div>`;
}

function copyTxt(t){
  if(!t){ toast('ไม่มีข้อมูลให้คัดลอก'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('คัดลอกแล้ว: '+String(t).slice(0,40))).catch(()=>toast('คัดลอกไม่ได้ — กดค้างเพื่อเลือกข้อความ'));
  } else {
    // Older in-app browsers block the clipboard API; fall back to a temporary textarea.
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('คัดลอกแล้ว'); }catch(e){ toast('คัดลอกไม่ได้'); }
    document.body.removeChild(ta);
  }
}

function renderVoucher(id){
  const b=findB(id)||{};
  VOUCH={ id, code:(b.voucher&&b.voucher.code)||'', url:(b.voucher&&b.voucher.url)||'',
           file:null, fileName:'', uploadedPath:null, uploading:false, busy:false };
  drawVoucher(id);
}
function drawVoucher(id){
  $("#app").innerHTML=`<div class="screen"><div class="appbar"><span class="back" onclick="renderAdminDetail('${id}')">‹</span><h1>แนบวอเชอร์</h1></div>
   <div class="body">
    <div class="card"><div class="label">เลขยืนยันจากชูวับ (จำเป็น)</div>
     <input class="txt" placeholder="เช่น CHW-889201" value="${esc(VOUCH.code)}" oninput="VOUCH.code=this.value"/></div>
    <div class="card">
     <div class="label">ไฟล์วอเชอร์ (เลือกอย่างใดอย่างหนึ่ง)</div>
     <input type="file" accept="image/*,application/pdf" onchange="onVoucherFilePicked(event)"/>
     ${VOUCH.fileName?`<div class="hint" style="margin-top:6px">📎 ${esc(VOUCH.fileName)} ${VOUCH.uploading?'· กำลังอัปโหลด…':(VOUCH.uploadedPath?'· พร้อมส่ง':'')}</div>`:''}
     <div class="hint" style="text-align:center;margin:10px 0">— หรือ —</div>
     <div class="label">วางลิงก์ไฟล์วอเชอร์</div>
     <input class="txt" placeholder="วางลิงก์ไฟล์วอเชอร์ (Google Drive / OneDrive)" value="${esc(VOUCH.url)}" oninput="VOUCH.url=this.value"/>
     <div class="hint" style="margin:8px 0 0">อัปโหลดไฟล์ด้านบน หรือวางลิงก์ที่แชร์ได้ — พนักงานจะกดเปิดได้จากหน้าสถานะ</div></div>
    <button class="btn" ${(VOUCH.busy||VOUCH.uploading)?'disabled':''} onclick="confirmVoucher('${id}')">${VOUCH.busy?'กำลังส่ง…':'ส่งวอเชอร์ให้พนักงาน'}</button></div></div>`;
}
async function onVoucherFilePicked(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  VOUCH.file=f; VOUCH.fileName=f.name; VOUCH.uploadedPath=null; VOUCH.uploading=true; rerender(()=>drawVoucher(VOUCH.id));
  try{
    const sig = await apiSend('/voucher-upload-url','POST',{ booking_id:VOUCH.id, filename:f.name, content_type:f.type||'application/octet-stream' });
    const putRes = await fetch(sig.signed_url, { method:'PUT', headers:{ 'Content-Type': f.type||'application/octet-stream' }, body:f });
    if(!putRes.ok) throw new Error('อัปโหลดไฟล์ไม่สำเร็จ ('+putRes.status+')');
    VOUCH.uploadedPath = sig.path;
  }catch(e){
    toast('อัปโหลดไม่สำเร็จ: '+e.message);
    VOUCH.file=null; VOUCH.fileName=''; VOUCH.uploadedPath=null;
  }
  VOUCH.uploading=false; rerender(()=>drawVoucher(VOUCH.id));
}
async function confirmVoucher(id){
  if(VOUCH.busy || VOUCH.uploading) return;
  if(!VOUCH.code||!VOUCH.code.trim()){ toast('กรอกเลขยืนยันจากชูวับก่อน'); return; }
  const finalPath = VOUCH.uploadedPath || null;
  const finalUrl = !finalPath && VOUCH.url && VOUCH.url.trim() ? VOUCH.url.trim() : null;
  if(!finalPath && !finalUrl){ toast('แนบไฟล์หรือวางลิงก์วอเชอร์อย่างใดอย่างหนึ่งก่อน'); return; }
  VOUCH.busy=true; rerender(()=>drawVoucher(id));
  try{
    await apiSend('/bookings','PATCH',{ booking_id:id, action:'attach_voucher', confirmation_no:VOUCH.code, voucher_storage_path:finalPath, voucher_file_url:finalUrl });
    toast('บันทึกวอเชอร์แล้ว ✓ พนักงานเห็นได้ทันที');
    await reloadBookings(false);
    VOUCH.busy=false;
    setTimeout(renderAdminQueue,400);
  }catch(e){ VOUCH.busy=false; toast(e.message); rerender(()=>drawVoucher(id)); }
}

/* ================= เบิกคืนมัดจำ (พนักงาน) ================= */
function openDepositClaim(bookingId){
  DEP = { bookingId, amount:'', bankAccount:ME.bank_account_no||'', bankName:ME.bank_name||'', accountName:ME.bank_account_name||ME.name, note:'', busy:false };
  drawDepositClaim();
}
function drawDepositClaim(){
  const b = findB(DEP.bookingId); if(!b){ goHome(); return; }
  $("#app").innerHTML=`<div class="screen"><div class="appbar"><span class="back" onclick="renderStatus('${DEP.bookingId}')">‹</span><h1>ขอเบิกคืนมัดจำ</h1></div>
   <div class="body">
    <div class="card"><div class="val" style="font-size:14px">${esc(b.branch)}</div>
     <div class="hint">${fmtDate(b.checkin)}–${fmtDate(b.checkout)}</div></div>
    <div class="card"><div class="label">จำนวนเงินมัดจำ (บาท)</div>
     <input class="txt" type="number" placeholder="เช่น 1000" value="${esc(DEP.amount)}" oninput="DEP.amount=this.value"/>
     <div class="label" style="margin-top:10px">ธนาคาร</div>
     <input class="txt" placeholder="เช่น กสิกรไทย" value="${esc(DEP.bankName)}" oninput="DEP.bankName=this.value"/>
     <div class="label" style="margin-top:10px">เลขบัญชี</div>
     <input class="txt" placeholder="เลขที่บัญชี" value="${esc(DEP.bankAccount)}" oninput="DEP.bankAccount=this.value"/>
     <div class="label" style="margin-top:10px">ชื่อบัญชี</div>
     <input class="txt" value="${esc(DEP.accountName)}" oninput="DEP.accountName=this.value"/>
     <div class="label" style="margin-top:10px">หมายเหตุ (ไม่บังคับ)</div>
     <textarea class="txt" oninput="DEP.note=this.value">${esc(DEP.note)}</textarea></div>
    <button class="btn" ${DEP.busy?'disabled':''} onclick="submitDepositClaim()">${DEP.busy?'กำลังส่ง…':'ส่งคำขอเบิกคืน'}</button></div></div>`;
}
async function submitDepositClaim(){
  const amt = parseFloat(DEP.amount);
  if(!amt || amt<=0){ toast('กรอกจำนวนเงินให้ถูกต้อง'); return; }
  if(!DEP.bankAccount || !String(DEP.bankAccount).trim()){ toast('กรอกเลขบัญชีก่อน'); return; }
  DEP.busy=true; rerender(drawDepositClaim);
  try{
    await apiSend('/deposit-claims','POST',{
      booking_id: DEP.bookingId, amount: amt, bank_name: DEP.bankName||'',
      bank_account_no: DEP.bankAccount, bank_account_name: DEP.accountName||'', note: DEP.note||''
    });
    toast('ส่งคำขอเบิกคืนมัดจำแล้ว ✓');
    renderStatus(DEP.bookingId);
  }catch(e){ DEP.busy=false; toast(e.message); rerender(drawDepositClaim); }
}

/* ================= เบิกคืนมัดจำ (แอดมิน) ================= */
async function renderDepositClaims(){
  screenLoading('กำลังโหลดคำขอเบิกคืนมัดจำ…');
  try{
    const d = await apiGet('/deposit-claims?scope=admin&actor='+encodeURIComponent(ME.code));
    DEPCLAIMS = d.claims || [];
  }catch(e){ toast(e.message); DEPCLAIMS=[]; }
  drawDepositClaims();
}
function drawDepositClaims(){
  const STATUS_PILL = { 'รอตรวจ':'wait', 'อนุมัติแต่ยังไม่คืน':'soon', 'คืนแล้ว':'ok' };
  const rows = DEPCLAIMS.map(c=>{
    const staff = STAFF[c.claimed_by_employee];
    return `<div class="job" role="button" tabindex="0" onclick="renderDepositClaimDetail('${c.id}')" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();renderDepositClaimDetail('${c.id}')}">
     <div class="d" style="background:var(--amber-soft);color:var(--amber)">${Number(c.amount||0).toLocaleString()}<small>฿</small></div>
     <div class="g"><div class="t">${esc(staff?staff.name:c.claimed_by_employee)}</div>
      <div class="s">${esc(c.booking_id)} · ${esc(c.bank_name||'')}</div>
      <div style="margin-top:5px"><span class="pill ${STATUS_PILL[c.status]||'wait'}">${esc(c.status)}</span></div></div><div class="chev">›</div></div>`;
  }).join("");
  $("#app").innerHTML=`<div class="screen"><div class="appbar"><span class="back" onclick="renderAdminQueue()">‹</span><h1>คำขอเบิกคืนมัดจำ</h1></div>
   <div class="body">${rows||'<div class="hint">ยังไม่มีคำขอเบิกคืนมัดจำ</div>'}</div></div>`;
}
function renderDepositClaimDetail(id){
  const c = DEPCLAIMS.find(x=>x.id===id); if(!c){ toast('ไม่พบคำขอนี้'); renderDepositClaims(); return; }
  const staff = STAFF[c.claimed_by_employee];
  const next = { 'รอตรวจ':{action:'accept',label:'อนุมัติแต่ยังไม่คืน'}, 'อนุมัติแต่ยังไม่คืน':{action:'mark_returned',label:'คืนแล้ว'} }[c.status];
  $("#app").innerHTML=`<div class="screen"><div class="appbar"><span class="back" onclick="renderDepositClaims()">‹</span><h1>รายละเอียดคำขอ</h1></div>
   <div class="body">
    <div class="card">
     <div class="copyrow"><span class="k">พนักงาน</span><span class="v">${esc(staff?staff.name:c.claimed_by_employee)}</span></div>
     <div class="copyrow"><span class="k">การจอง</span><span class="v">${esc(c.booking_id)}</span></div>
     <div class="copyrow"><span class="k">จำนวนเงิน</span><span class="v">${Number(c.amount||0).toLocaleString()}฿</span></div>
     <div class="copyrow"><span class="k">ธนาคาร</span><span class="v">${esc(c.bank_name||'—')}</span></div>
     <div class="copyrow"><span class="k">เลขบัญชี</span><span class="v">${esc(c.bank_account_no||'—')}</span>${copyChip(`'${esc(c.bank_account_no||'')}'`)}</div>
     <div class="copyrow"><span class="k">ชื่อบัญชี</span><span class="v">${esc(c.bank_account_name||'—')}</span></div>
     ${c.note?`<div class="copyrow"><span class="k">หมายเหตุ</span><span class="v">${esc(c.note)}</span></div>`:''}
     <div class="copyrow"><span class="k">สถานะ</span><span class="v">${esc(c.status)}</span></div></div>
    ${next?`<button class="btn" onclick="advanceClaim('${c.id}','${next.action}')">เปลี่ยนสถานะเป็น "${esc(next.label)}"</button>`:''}
   </div></div>`;
}
async function advanceClaim(id,action){
  try{
    await apiSend('/deposit-claims','PATCH',{ claim_id:id, action });
    toast('อัปเดตสถานะแล้ว ✓');
    await renderDepositClaims();
    renderDepositClaimDetail(id);
  }catch(e){ toast(e.message); }
}

tryLiffAutoLogin();
